<!-- ЧАСТЬ 1: CSS — вставить в первый блок T123 -->
<style>
:root{
  --red:#DB0032;--red-dark:#b5001f;--red-soft:rgba(219,0,50,.09);
  --black:#0f0f0f;--white:#ffffff;--off:#f5f5f7;
  --g1:#f2f2f4;--g2:#e2e2e6;--g3:#ababaf;--g4:#444450;
  --r:12px;--r-lg:20px;--r-sm:8px;--r-xs:6px;
  --sh:0 2px 12px rgba(0,0,0,.07);--sh2:0 6px 28px rgba(0,0,0,.12);
  --sh-red:0 4px 18px rgba(219,0,50,.24);
  --tr:.18s ease;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"Inter",system-ui,sans-serif;background:var(--off);color:var(--black);line-height:1.6;font-size:14px;-webkit-font-smoothing:antialiased}

/* FOOTER с кнопкой настроек */
.page-footer{
  text-align:center;padding:28px 16px 36px;
  border-top:1px solid var(--g2);margin-top:16px;
}
.settings-trigger{
  display:inline-flex;align-items:center;gap:6px;
  background:transparent;border:none;
  color:var(--g3);font-size:11px;font-weight:500;
  letter-spacing:.06em;cursor:pointer;font-family:inherit;
  transition:color var(--tr);padding:6px 10px;
  text-transform:uppercase;
}
.settings-trigger:hover{color:var(--g4)}
.settings-trigger svg{width:13px;height:13px;opacity:.7}

/* PRICE STICKER — яркий, фирменный */
.price-sticker{
  position:fixed;top:16px;right:16px;z-index:200;
  background:#ffffff;
  border:1.5px solid var(--g2);
  border-radius:var(--r-lg);
  padding:14px 18px 16px;min-width:200px;
  box-shadow:0 8px 40px rgba(0,0,0,.13),0 2px 8px rgba(0,0,0,.07);
  opacity:0;transform:translateY(-10px) scale(.95);
  transition:all .3s cubic-bezier(.22,.9,.36,1);
  pointer-events:none;
}
.price-sticker.show{opacity:1;transform:translateY(0) scale(1)}
.ps-label{
  font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--g3);margin-bottom:4px;
}
.ps-unit{
  font-size:26px;font-weight:700;letter-spacing:-.03em;
  color:var(--black);line-height:1.1;
}
.ps-unit span{font-size:14px;font-weight:600;color:var(--g3);letter-spacing:0}
.ps-sep{height:1px;background:var(--g2);margin:10px 0}
.ps-total-row{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:var(--red);border-radius:var(--r-sm);
  padding:8px 12px;margin-top:2px;
}
.ps-total-label{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.75)}
.ps-total-val{font-size:15px;font-weight:700;color:#fff;letter-spacing:-.01em}
.ps-name{
  font-size:10px;color:var(--g3);margin-top:8px;font-weight:400;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px;
}

/* HERO */
.hero{
  background:var(--red);
  background-image:linear-gradient(135deg,#DB0032 0%,#a50026 100%);
  color:#fff;padding:52px 32px 64px;text-align:center;
  position:relative;overflow:hidden;
}
.hero::after{content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse 55% 90% at 100% 50%,rgba(255,255,255,.07) 0%,transparent 70%);
  pointer-events:none;}
.hero-sign-bg{
  position:absolute;right:-45px;top:50%;transform:translateY(-50%);
  height:260px;width:260px;object-fit:contain;opacity:.16;pointer-events:none;
}
.hero-badge{
  display:inline-flex;align-items:center;gap:6px;
  border:1px solid rgba(255,255,255,.3);color:rgba(255,255,255,.9);
  font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;
  padding:6px 18px;border-radius:100px;margin-bottom:20px;
  background:rgba(255,255,255,.08);backdrop-filter:blur(6px);
}
.hero h1{
  font-size:clamp(24px,4vw,46px);font-weight:700;line-height:1.14;
  margin-bottom:12px;letter-spacing:-.02em;position:relative;
}
.hero p{
  font-size:15px;color:rgba(255,255,255,.75);max-width:460px;
  margin:0 auto;position:relative;line-height:1.65;
}

/* WRAP */
.wrap{max-width:900px;margin:0 auto;padding:40px 22px 80px}

/* STEP HEADER */
.sec-block{margin-bottom:28px}
.sec-h{font-size:18px;font-weight:700;margin-bottom:4px;letter-spacing:-.01em}
.sec-s{font-size:12px;color:var(--g3);font-weight:400}

/* TYPE LABEL */
.type-label{
  font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--g3);margin-bottom:8px;display:block;
}

/* CAT GRID */
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:20px}
.cat-card{
  background:var(--white);border:1.5px solid var(--g2);border-radius:var(--r-lg);
  padding:16px 10px 14px;cursor:pointer;transition:all var(--tr);text-align:center;
  box-shadow:var(--sh);
}
.cat-card:hover{border-color:var(--red);transform:translateY(-2px);box-shadow:var(--sh2)}
.cat-card.active{background:var(--red);border-color:var(--red);color:#fff;box-shadow:var(--sh-red)}
.cat-card .ic{font-size:24px;display:block;margin-bottom:7px;line-height:1}
.cat-card .nm{font-size:12px;font-weight:700;line-height:1.3}
.cat-card .ct{font-size:10px;color:var(--g3);margin-top:3px}
.cat-card.active .ct{color:rgba(255,255,255,.55)}

/* SUBPILLS */
.subpills{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:20px}
.subpill{
  padding:6px 15px;border:1.5px solid var(--g2);border-radius:100px;
  font-size:12px;font-weight:600;cursor:pointer;background:var(--white);
  color:var(--g4);transition:all var(--tr);
  box-shadow:0 1px 3px rgba(0,0,0,.04);
}
.subpill:hover{border-color:var(--red);color:var(--red)}
.subpill.active{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 2px 10px rgba(219,0,50,.22)}

/* SELECT */
.sel-wrap{position:relative;margin-bottom:22px}
.sel-wrap select{
  width:100%;padding:12px 42px 12px 16px;
  border:1.5px solid var(--g2);border-radius:var(--r);
  background:var(--white);font-family:inherit;font-size:14px;
  color:var(--black);appearance:none;cursor:pointer;
  transition:all var(--tr);box-shadow:var(--sh);font-weight:500;
}
.sel-wrap select:hover{border-color:var(--g3)}
.sel-wrap select:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px rgba(219,0,50,.1)}
.sel-wrap::after{content:"▾";position:absolute;right:15px;top:50%;transform:translateY(-50%);color:var(--g3);pointer-events:none}

/* CFG */
.cfg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:18px}
@media(max-width:600px){.cfg{grid-template-columns:1fr}}
.fld label{display:block;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--g3);margin-bottom:6px}
.fld input,.fld select{
  width:100%;padding:11px 12px;border:1.5px solid var(--g2);border-radius:var(--r);
  font-family:inherit;font-size:13px;background:var(--white);color:var(--black);
  transition:all var(--tr);appearance:none;box-shadow:var(--sh);font-weight:500;
}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px rgba(219,0,50,.1)}

/* TOGGLES */
.tog-sec{
  background:var(--white);border:1.5px solid var(--g2);border-radius:var(--r-lg);
  padding:18px 20px;margin-bottom:14px;box-shadow:var(--sh);
}
.tog-sec h3{font-size:13px;font-weight:700;margin-bottom:3px}
.tog-sec .hint{font-size:11px;color:var(--g3);margin-bottom:12px}
.tog-row{display:flex;gap:8px;flex-wrap:wrap}
.tog{
  display:flex;align-items:center;gap:7px;padding:7px 14px;
  border:1.5px solid var(--g2);border-radius:var(--r);
  cursor:pointer;font-size:12px;font-weight:600;background:var(--white);
  color:var(--g4);transition:all var(--tr);user-select:none;
}
.tog:hover{border-color:var(--red);color:var(--red)}
.tog.on{border-color:var(--red);background:var(--red-soft);color:var(--red);box-shadow:0 1px 8px rgba(219,0,50,.1)}
.tog .dot{width:12px;height:12px;border-radius:50%;border:2px solid currentColor;transition:all var(--tr);flex-shrink:0}
.tog.on .dot{background:var(--red);border-color:var(--red)}

/* NOTICE */
.notice{
  background:rgba(219,0,50,.05);border:1px solid rgba(219,0,50,.15);
  border-radius:var(--r);padding:11px 15px;font-size:12px;
  color:#8a001a;margin-bottom:18px;line-height:1.55;font-weight:500;
}

/* RESULT */
.result{display:none;animation:fadeUp .32s cubic-bezier(.22,.9,.36,1)}
.result.show{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.r-top{
  background:var(--red);background-image:linear-gradient(135deg,#DB0032 0%,#a50026 100%);
  color:#fff;border-radius:var(--r-lg) var(--r-lg) 0 0;padding:22px 26px;
  display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;
}
.r-top h2{font-size:16px;font-weight:700;margin-bottom:3px;letter-spacing:-.01em}
.r-top .meta{font-size:11px;color:rgba(255,255,255,.7)}
.rprices{text-align:right}
.r-unit{font-size:28px;font-weight:700;line-height:1;letter-spacing:-.02em}
.r-total{font-size:12px;color:rgba(255,255,255,.7);margin-top:4px;font-weight:500}
.r-body{
  background:var(--white);border:1.5px solid var(--g2);border-top:none;
  border-radius:0 0 var(--r-lg) var(--r-lg);overflow:hidden;
  box-shadow:0 6px 28px rgba(0,0,0,.07);
}
table.rt{width:100%;border-collapse:collapse}
table.rt thead tr{background:var(--g1)}
table.rt th{padding:9px 18px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--g3);font-weight:700;text-align:left}
table.rt th:last-child{text-align:right}
table.rt td{padding:11px 18px;font-size:13px;border-bottom:1px solid var(--g1);vertical-align:top}
table.rt td:last-child{text-align:right;font-weight:600;white-space:nowrap}
table.rt tr:last-child td{border-bottom:none}
table.rt tr:hover td{background:rgba(219,0,50,.02)}
table.rt tr.zero-row td{color:var(--g2)}
table.rt tr.total-row td{background:var(--g1);font-weight:700;font-size:14px;border-top:2px solid var(--g2);border-bottom:none}
table.rt tr.grand-row td{background:var(--black);color:#fff;font-weight:700;font-size:15px;border:none}
.rn{display:block;font-size:10px;color:var(--g3);font-weight:400;margin-top:2px}

/* ADMIN OVERLAY */
.ov{display:none;position:fixed;inset:0;background:rgba(10,10,10,.75);z-index:500;
  align-items:flex-start;justify-content:center;padding:20px;
  backdrop-filter:blur(10px);overflow-y:auto}
.ov.open{display:flex}
.modal{
  background:var(--white);border-radius:var(--r-lg);width:100%;max-width:920px;
  box-shadow:0 32px 80px rgba(0,0,0,.4);margin:auto;overflow:hidden;
}
.pwd-scr{padding:40px 36px}
.pwd-scr h2{font-size:20px;font-weight:700;margin-bottom:6px}
.pwd-scr p{font-size:13px;color:var(--g3);margin-bottom:20px}
.pwd-inp{
  width:100%;padding:12px 14px;border:1.5px solid var(--g2);border-radius:var(--r);
  font-size:14px;font-family:inherit;margin-bottom:11px;transition:all var(--tr);
}
.pwd-inp:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px rgba(219,0,50,.1)}
.pwd-btn{
  width:100%;padding:13px;background:var(--red);
  background-image:linear-gradient(135deg,#DB0032 0%,#b5001f 100%);
  color:#fff;border:none;border-radius:var(--r);font-family:inherit;
  font-size:14px;font-weight:700;cursor:pointer;letter-spacing:.06em;
  text-transform:uppercase;box-shadow:var(--sh-red);transition:all var(--tr);
}
.pwd-btn:hover{box-shadow:0 8px 24px rgba(219,0,50,.38);transform:translateY(-1px)}
.pwd-err{color:var(--red);font-size:12px;font-weight:600;margin-top:8px;display:none}
.adm-hdr{
  background:var(--red);background-image:linear-gradient(135deg,#DB0032 0%,#a50026 100%);
  color:#fff;padding:16px 26px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:2;
}
.adm-hdr h2{font-size:14px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.adm-close{
  background:rgba(255,255,255,.18);border:none;color:#fff;
  width:30px;height:30px;border-radius:var(--r-sm);cursor:pointer;
  font-size:16px;display:flex;align-items:center;justify-content:center;
  transition:background var(--tr);
}
.adm-close:hover{background:rgba(255,255,255,.3)}
.adm-tabs{
  display:flex;border-bottom:2px solid var(--g2);background:var(--white);
  overflow-x:auto;padding:0 22px;
}
.adm-tab{
  padding:12px 15px;font-size:11px;font-weight:700;cursor:pointer;color:var(--g3);
  border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;
  transition:all var(--tr);letter-spacing:.05em;text-transform:uppercase;
}
.adm-tab:hover{color:var(--black)}
.adm-tab.active{color:var(--red);border-bottom-color:var(--red)}
.adm-panel{display:none;padding:22px 26px}
.adm-panel.active{display:block}
.svc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin-bottom:24px}
@media(max-width:500px){.svc-grid{grid-template-columns:1fr}}
.svc-sec{
  font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--red);padding-bottom:7px;border-bottom:2px solid rgba(219,0,50,.2);margin-bottom:14px;
}
.svc-fld label{display:block;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--g3);margin-bottom:5px}
.svc-fld input{
  width:100%;padding:8px 10px;border:1.5px solid var(--g2);border-radius:var(--r-sm);
  font-size:13px;font-family:inherit;background:var(--white);transition:all var(--tr);font-weight:500;
}
.svc-fld input:focus{outline:none;border-color:var(--red)}
.prod-search{
  width:100%;padding:10px 13px;border:1.5px solid var(--g2);border-radius:var(--r);
  font-size:13px;font-family:inherit;margin-bottom:14px;transition:all var(--tr);
}
.prod-search:focus{outline:none;border-color:var(--red)}
.prod-table{width:100%;border-collapse:collapse}
.prod-table th{background:var(--g1);padding:8px 10px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--g3);font-weight:700;text-align:left;position:sticky;top:0;border-bottom:2px solid var(--g2)}
.prod-table td{padding:8px 10px;font-size:12px;border-bottom:1px solid var(--g1);vertical-align:middle;font-weight:500}
.prod-table tr:hover td{background:rgba(219,0,50,.02)}
.prod-table tr.hidden-prod td{opacity:.38}
.prod-name{font-weight:700}
.price-inp{
  width:68px;padding:5px 7px;border:1.5px solid var(--g2);border-radius:var(--r-xs);
  font-size:12px;font-family:inherit;text-align:right;transition:all var(--tr);font-weight:500;
}
.price-inp:focus{outline:none;border-color:var(--red)}
.sw{position:relative;display:inline-block;width:38px;height:22px}
.sw input{opacity:0;width:0;height:0}
.sw-slider{position:absolute;cursor:pointer;inset:0;background:var(--g2);border-radius:22px;transition:.2s}
.sw-slider::before{content:"";position:absolute;height:16px;width:16px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.sw input:checked+.sw-slider{background:var(--red)}
.sw input:checked+.sw-slider::before{transform:translateX(16px)}
.save-bar{display:flex;align-items:center;gap:14px;padding:14px 0 4px;border-top:1.5px solid var(--g2);margin-top:8px}
.save-btn{
  padding:11px 24px;background:var(--red);
  background-image:linear-gradient(135deg,#DB0032 0%,#b5001f 100%);
  color:#fff;border:none;border-radius:var(--r);font-family:inherit;font-size:12px;
  font-weight:700;cursor:pointer;transition:all var(--tr);letter-spacing:.07em;text-transform:uppercase;box-shadow:var(--sh-red);
}
.save-btn:hover{box-shadow:0 6px 20px rgba(219,0,50,.35);transform:translateY(-1px)}
.save-ok{color:var(--red);font-size:12px;font-weight:700;display:none}
.table-wrap{max-height:440px;overflow-y:auto;border:1.5px solid var(--g2);border-radius:var(--r);overflow:hidden}
/* TEXT EDITOR in admin */
.txt-grid{display:grid;gap:12px;margin-bottom:20px}
.txt-fld label{display:block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--g3);margin-bottom:5px}
.txt-fld input,.txt-fld textarea{
  width:100%;padding:8px 11px;border:1.5px solid var(--g2);border-radius:var(--r-sm);
  font-size:13px;font-family:inherit;background:var(--white);resize:vertical;
  transition:all var(--tr);min-height:36px;
}
.txt-fld input:focus,.txt-fld textarea:focus{outline:none;border-color:var(--red)}
@media(max-width:640px){
  .r-top{flex-direction:column}.rprices{text-align:left}
  .wrap{padding:28px 14px 60px}.hero{padding:40px 18px 52px}
  .price-sticker{right:10px;min-width:170px}
  .price-sticker .ps-unit{font-size:21px}
}
</style>
